name: Feature request
description: Propose a focused improvement to the plugin or Skill
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or failure mode should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior without assuming a particular implementation.
    validations:
      required: true
  - type: dropdown
    id: semantic_impact
    attributes:
      label: Expected semantic impact
      options:
        - S0 — wording or layout only
        - S1 — evidenced meaning made explicit
        - S2 — reversible low-impact default
        - S3 — scope, method, deliverable, or evaluation change
        - S4 — goal, rights, risk, compliance, sensitive data, or irreversible action change
        - Unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and trade-offs
      description: Include examples, test ideas, affected users, risks, and alternatives.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I did not include credentials, private prompts, personal data, or vulnerability details.
          required: true
